[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-outreach"
version = "0.1.0"
description = "Find recruiters with Apollo, research the company with Claude, and send personal emails with a resume attached."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
]
dev = [
  "pytest>=8",
  "aiosmtpd>=1.4",
]

[project.scripts]
outreach = "outreach.cli:main"

[tool.setuptools]
packages = ["outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
