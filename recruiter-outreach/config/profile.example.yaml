# Who the emails are from, what they may say, and how they must sound. Copy to profile.yaml (gitignored).
# Everything the writer is allowed to claim comes from `experiences`. If it is not here, it is not said.

name: Jordan Lee
first_name: Jordan
school: Example University
opening_sentence: "My name is Jordan and I am a student studying Computer Science at Example University."
graduation: May 2028           # used only to check eligibility in research, never written in the email
target_term: Summer 2027
citizenship_note: "U.S. citizen, no sponsorship needed."
subject_example: "CS student interested in the Software Engineering Intern role"

closing_lines:
  - "Thank you for reading and I look forward to hearing back!"
  - ""
  - "Warm Regards,"
signature_lines:               # printed under the name; not style-checked
  - "(555) 555-0100 | jordan@example.edu"
  - "linkedin.com/in/jordan-lee | github.com/jordan-lee"

home_cities: [San Francisco, Palo Alto, Mountain View]
near_home_line: "The {city} office would also put me close to home."

resumes:                       # one per track; a target can override with `resume:`
  swe: ~/Desktop/Resume_swe.pdf
  pm: ~/Desktop/Resume_pm.pdf
  consulting: ~/Desktop/Resume_consulting.pdf
resume_attachment_name: Jordan_Lee_Resume.pdf

experiences:
  - id: example-internship
    tracks: [swe, pm]
    summary: >-
      Summer 2026 engineering intern at Example Startup. Built a Python pipeline that reviews 1,000
      support tickets a week and groups them into product fixes; 40 percent of its suggestions shipped.
    approved_wording:
      - "At Example Startup, I built a weekly Python pipeline that turned support tickets into product fixes"

facts_never_to_use:
  - Exact test counts
  - Anything not listed under experiences

followup_template: >-
  I wanted to follow up on my note below about the {role} role at {company}. I have attached my resume
  again in case it is helpful, and if someone else on the team is the right person to talk to, I would
  be grateful for a pointer.

style:
  max_numbers: 3
  min_words: 120
  max_words: 200
  max_subject_chars: 70
  allow_parentheses: false
  allow_graduation_mention: false
  banned_topics: []
  voice_notes: >-
    Warm, plain, curious first person. Concrete details over adjectives. No formula openers,
    no zingers, no fake feelings.
  # Optional: append your own rules file to the writer prompt.
  # extra_rules_file: ~/Desktop/job-agent/prompts/outreach_rules.md
